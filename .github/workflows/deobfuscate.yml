name: XP-Compatible Game Runner

on:
  workflow_dispatch:
  push:
    paths:
      - 'plants_vs_zombies.zip'
      - '.github/workflows/xp-game-runner.yml'

jobs:
  prepare-xp-runner:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wine + dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            wine64 wine32 winetricks cabextract unzip p7zip-full xvfb zip \
            libgl1-mesa-glx libglu1-mesa

      - name: Create Wine prefix (Windows XP) – fully headless + force
        env:
          WINEPREFIX: ${{ github.workspace }}/wine-xp
          WINEARCH: win32
          WINEDEBUG: -all
        run: |
          set -e
          mkdir -p "$WINEPREFIX"
          rm -rf "$WINEPREFIX"/* 2>/dev/null || true

          Xvfb :99 -screen 0 1024x768x24 -ac +extension GLX +render -noreset > /tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 3

          xvfb-run -a wineboot --init || true
          sleep 2

          xvfb-run -a winetricks -q --force winxp || true
          xvfb-run -a winetricks -q --force corefonts || true
          xvfb-run -a winetricks -q --force vcrun2005 || true
          xvfb-run -a winetricks -q --force vcrun2008 || true
          xvfb-run -a winetricks -q --force vcrun2010 || true
          xvfb-run -a winetricks -q --force d3dx9 || true

          xvfb-run -a wine reg add "HKCU\\Software\\Wine" /v Version /t REG_SZ /d "winxp" /f || true
          xvfb-run -a wine reg add "HKCU\\Software\\Wine\\DllOverrides" /v d3d9 /t REG_SZ /d "native,builtin" /f || true
          xvfb-run -a wine reg add "HKCU\\Software\\Wine\\DllOverrides" /v d3d8 /t REG_SZ /d "native,builtin" /f || true

          mkdir -p "$WINEPREFIX/dosdevices"
          ln -sfn /tmp "$WINEPREFIX/dosdevices/d:" || true

          kill $XVFB_PID 2>/dev/null || true
          sleep 1
          echo "Prefix created."

      - name: Extract game zip
        run: |
          set -e
          if [ ! -f plants_vs_zombies.zip ]; then
            echo "ERROR: plants_vs_zombies.zip not found in repo root"
            exit 1
          fi
          mkdir -p game
          unzip -o plants_vs_zombies.zip -d game
          if [ $(find game -mindepth 1 -maxdepth 1 -type d | wc -l) -eq 1 ] && \
             [ $(find game -mindepth 1 -maxdepth 1 -type f | wc -l) -eq 0 ]; then
            TOP=$(find game -mindepth 1 -maxdepth 1 -type d)
            mv "$TOP"/* game/ 2>/dev/null || true
            rmdir "$TOP" 2>/dev/null || true
          fi
          echo "=== .exe files found ==="
          find game -type f -iname "*.exe" -print || true

      - name: Create launcher scripts (Downloads access)
        run: |
          cat > run-game.sh << 'EOF'
          #!/bin/bash
          set -e
          export WINEPREFIX="$(pwd)/wine-xp"
          export WINEARCH=win32
          export WINEDLLOVERRIDES="mscoree,mshtml="
          export WINEDEBUG=-all
          mkdir -p "$WINEPREFIX/dosdevices"
          ln -sfn "${HOME}/Downloads" "$WINEPREFIX/dosdevices/d:" 2>/dev/null || true
          cd game
          EXE=$(find . -maxdepth 3 \( -iname "*plants*zombies*.exe" -o -iname "pvz*.exe" -o -iname "*.exe" \) | head -1)
          if [ -z "$EXE" ]; then
            echo "No .exe found in game/"
            exit 1
          fi
          echo "Launching: $EXE"
          wine "\( EXE" " \)@"
          EOF
          chmod +x run-game.sh

          cat > run-any-exe.sh << 'EOF'
          #!/bin/bash
          set -e
          export WINEPREFIX="$(pwd)/wine-xp"
          export WINEARCH=win32
          export WINEDLLOVERRIDES="mscoree,mshtml="
          export WINEDEBUG=-all
          mkdir -p "$WINEPREFIX/dosdevices"
          ln -sfn "${HOME}/Downloads" "$WINEPREFIX/dosdevices/d:" 2>/dev/null || true
          if [ $# -lt 1 ]; then
            echo "Usage: $0 <path-to-exe> [args...]"
            echo "  $0 \~/Downloads/SomeGame.exe"
            echo "  $0 'd:\\SomeGame.exe'"
            exit 1
          fi
          wine "$@"
          EOF
          chmod +x run-any-exe.sh

          cat > play-from-downloads.sh << 'EOF'
          #!/bin/bash
          set -e
          export WINEPREFIX="$(pwd)/wine-xp"
          export WINEARCH=win32
          export WINEDLLOVERRIDES="mscoree,mshtml="
          export WINEDEBUG=-all
          mkdir -p "$WINEPREFIX/dosdevices"
          ln -sfn "${HOME}/Downloads" "$WINEPREFIX/dosdevices/d:" 2>/dev/null || true

          DOWNLOADS="${HOME}/Downloads"
          if [ ! -d "$DOWNLOADS" ]; then
            echo "Downloads folder not found: $DOWNLOADS"
            exit 1
          fi

          echo "=== .exe files in $DOWNLOADS ==="
          mapfile -t EXES < <(find "$DOWNLOADS" -maxdepth 2 -type f -iname "*.exe" 2>/dev/null | sort)
          if [ ${#EXES[@]} -eq 0 ]; then
            echo "No .exe files found in Downloads."
            exit 0
          fi

          for i in "${!EXES[@]}"; do
            printf "%2d) %s\n" \( ((i+1)) " \){EXES[$i]}"
          done
          echo
          read -p "Choose number (or q to quit): " choice
          if [[ "$choice" == "q" || "$choice" == "Q" ]]; then
            exit 0
          fi
          if ! [[ "\( choice" =\~ ^[0-9]+ \) ]] || [ "$choice" -lt 1 ] || [ "$choice" -gt ${#EXES[@]} ]; then
            echo "Invalid choice."
            exit 1
          fi

          SELECTED="\( {EXES[ \)((choice-1))]}"
          echo "Launching: $SELECTED"
          wine "$SELECTED"
          EOF
          chmod +x play-from-downloads.sh

      - name: Smoke-test
        env:
          WINEPREFIX: ${{ github.workspace }}/wine-xp
          WINEARCH: win32
          WINEDEBUG: -all
        run: |
          xvfb-run -a wine --version
          ls -l "$WINEPREFIX/dosdevices/" || true
          xvfb-run -a wine reg query "HKCU\\Software\\Wine" /v Version || true
          echo "Smoke test done."

      - name: Package as real ZIP (no .tar.gz)
        run: |
          mkdir -p dist
          cp -a wine-xp dist/
          cp -a game dist/
          cp run-game.sh run-any-exe.sh play-from-downloads.sh dist/
          cat > dist/README.txt << 'EOF'
          Windows XP Wine Runner

          How to use (Linux):
            1. Extract this entire zip
            2. Open a terminal inside the extracted folder
            3. Run one of:
                 ./run-game.sh
                 ./play-from-downloads.sh
                 ./run-any-exe.sh \~/Downloads/yourgame.exe

          D: drive inside Wine = your real Downloads folder
          EOF

          # Create a normal .zip that any phone / Windows / Android can open
          cd dist
          zip -r -9 ../xp-pvz-runner.zip .
          cd ..
          ls -lh xp-pvz-runner.zip
          echo "=== ZIP contents preview ==="
          unzip -l xp-pvz-runner.zip | head -30

      - name: Upload runner artifact
        uses: actions/upload-artifact@v4
        with:
          name: xp-pvz-runner
          path: xp-pvz-runner.zip
          retention-days: 30
