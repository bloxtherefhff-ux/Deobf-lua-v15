name: XP-Compatible Game Runner

on:
  workflow_dispatch:
  push:
    paths:
      - 'plants_vs_zombies.zip'
      - '.github/workflows/xp-game-runner.yml'

jobs:
  prepare-xp-runner:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Wine + dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32 winetricks cabextract unzip p7zip-full xvfb

      - name: Create Wine prefix (Windows XP) – headless
        env:
          WINEPREFIX: ${{ github.workspace }}/wine-xp
          WINEARCH: win32
          DISPLAY: :99
        run: |
          mkdir -p "$WINEPREFIX"
          # Start a virtual X server for the entire step
          Xvfb :99 -screen 0 1024x768x24 > /tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 2

          # Initialize prefix under Xvfb
          xvfb-run -a wineboot --init

          # Install only the components that install cleanly headless
          # (vcrun6 is skipped – it requires a real window and is not required for PVZ / classic XP games)
          xvfb-run -a winetricks -q winxp
          xvfb-run -a winetricks -q corefonts
          xvfb-run -a winetricks -q vcrun2005
          xvfb-run -a winetricks -q vcrun2008
          xvfb-run -a winetricks -q vcrun2010
          xvfb-run -a winetricks -q d3dx9

          # Force XP version in registry
          xvfb-run -a wine reg add "HKCU\\Software\\Wine" /v Version /t REG_SZ /d "winxp" /f
          xvfb-run -a wine reg add "HKCU\\Software\\Wine\\DllOverrides" /v d3d9 /t REG_SZ /d "native,builtin" /f

          # Map host Downloads as drive D:
          mkdir -p "$WINEPREFIX/dosdevices"
          ln -sfn "$HOME/Downloads" "$WINEPREFIX/dosdevices/d:" || true

          # Clean up the virtual display
          kill $XVFB_PID 2>/dev/null || true

      - name: Extract game zip
        run: |
          mkdir -p game
          unzip -o plants_vs_zombies.zip -d game
          if [ $(find game -mindepth 1 -maxdepth 1 -type d | wc -l) -eq 1 ]; then
            TOP=$(find game -mindepth 1 -maxdepth 1 -type d)
            mv "$TOP"/* game/ 2>/dev/null || true
            rmdir "$TOP" 2>/dev/null || true
          fi
          find game -type f -name "*.exe" -print

      - name: Create launcher scripts (Downloads access)
        env:
          WINEPREFIX: ${{ github.workspace }}/wine-xp
        run: |
          cat > run-game.sh << 'EOF'
          #!/bin/bash
          set -e
          export WINEPREFIX="$(pwd)/wine-xp"
          export WINEARCH=win32
          export WINEDLLOVERRIDES="mscoree,mshtml="
          mkdir -p "$WINEPREFIX/dosdevices"
          ln -sfn "$HOME/Downloads" "$WINEPREFIX/dosdevices/d:" 2>/dev/null || true
          cd game
          EXE=$(find . -maxdepth 2 \( -iname "*plants*zombies*.exe" -o -iname "pvz*.exe" -o -iname "*.exe" \) | head -1)
          if [ -z "$EXE" ]; then
            echo "No .exe found in game/"
            exit 1
          fi
          echo "Launching: $EXE"
          wine "\( EXE" " \)@"
          EOF
          chmod +x run-game.sh

          cat > run-any-exe.sh << 'EOF'
          #!/bin/bash
          set -e
          export WINEPREFIX="$(pwd)/wine-xp"
          export WINEARCH=win32
          export WINEDLLOVERRIDES="mscoree,mshtml="
          mkdir -p "$WINEPREFIX/dosdevices"
          ln -sfn "$HOME/Downloads" "$WINEPREFIX/dosdevices/d:" 2>/dev/null || true
          if [ $# -lt 1 ]; then
            echo "Usage: $0 <path-to-exe> [args...]"
            echo "Example: $0 \~/Downloads/SomeGame.exe"
            echo "Or:      $0 'd:\\SomeGame.exe'"
            exit 1
          fi
          wine "$@"
          EOF
          chmod +x run-any-exe.sh

          cat > play-from-downloads.sh << 'EOF'
          #!/bin/bash
          set -e
          export WINEPREFIX="$(pwd)/wine-xp"
          export WINEARCH=win32
          export WINEDLLOVERRIDES="mscoree,mshtml="
          mkdir -p "$WINEPREFIX/dosdevices"
          ln -sfn "$HOME/Downloads" "$WINEPREFIX/dosdevices/d:" 2>/dev/null || true

          DOWNLOADS="$HOME/Downloads"
          if [ ! -d "$DOWNLOADS" ]; then
            echo "Downloads folder not found: $DOWNLOADS"
            exit 1
          fi

          echo "=== .exe files in $DOWNLOADS ==="
          mapfile -t EXES < <(find "$DOWNLOADS" -maxdepth 2 -type f -iname "*.exe" | sort)
          if [ ${#EXES[@]} -eq 0 ]; then
            echo "No .exe files found in Downloads."
            exit 0
          fi

          for i in "${!EXES[@]}"; do
            printf "%2d) %s\n" \( ((i+1)) " \){EXES[$i]}"
          done
          echo
          read -p "Choose number (or q to quit): " choice
          if [[ "$choice" == "q" || "$choice" == "Q" ]]; then
            exit 0
          fi
          if ! [[ "\( choice" =\~ ^[0-9]+ \) ]] || [ "$choice" -lt 1 ] || [ "$choice" -gt ${#EXES[@]} ]; then
            echo "Invalid choice."
            exit 1
          fi

          SELECTED="\( {EXES[ \)((choice-1))]}"
          echo "Launching: $SELECTED"
          wine "$SELECTED"
          EOF
          chmod +x play-from-downloads.sh

      - name: Smoke-test Wine XP prefix
        env:
          WINEPREFIX: ${{ github.workspace }}/wine-xp
          WINEARCH: win32
        run: |
          xvfb-run -a wine --version
          ls -l "$WINEPREFIX/dosdevices/" || true
          xvfb-run -a wine reg query "HKCU\\Software\\Wine" /v Version || true

      - name: Package artifact
        run: |
          mkdir -p dist
          cp -a wine-xp dist/
          cp -a game dist/
          cp run-game.sh run-any-exe.sh play-from-downloads.sh dist/
          cat > dist/README.txt << 'EOF'
          Windows XP Wine Runner – Downloads access enabled

          Quick start:
            ./run-game.sh                     # runs the pack that came with the zip
            ./play-from-downloads.sh          # lists every .exe in \~/Downloads and lets you pick one
            ./run-any-exe.sh \~/Downloads/foo.exe

          Wine drive mapping:
            D:  →  your real \~/Downloads folder
          EOF
          tar -czf xp-pvz-runner.tar.gz -C dist .

      - name: Upload runner artifact
        uses: actions/upload-artifact@v4
        with:
          name: xp-pvz-runner
          path: xp-pvz-runner.tar.gz
          retention-days: 30
