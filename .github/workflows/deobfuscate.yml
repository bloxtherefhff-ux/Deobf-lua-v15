name: Build Custom Winlator-like APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'games.zip'
      - '.github/workflows/build-winlator-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip zip apksigner zipalign openjdk-17-jdk wget

      - name: Download base Winlator APK (open-source release)
        run: |
          # Using a public release as base. Change the URL when a newer one appears.
          # This is the practical way – full native rebuild is not feasible on GHA.
          wget -O base.apk "https://github.com/brunodev85/winlator/releases/download/v7.1.0/Winlator-7.1.apk" || \
          wget -O base.apk "https://github.com/brunodev85/winlator/releases/latest/download/app-release.apk"

          # Fallback if the above links move – you can replace with any public Winlator APK URL
          ls -lh base.apk

      - name: Unpack base APK
        run: |
          mkdir -p apk_unpacked
          unzip -q base.apk -d apk_unpacked
          ls apk_unpacked

      - name: Inject game zip
        run: |
          if [ ! -f games.zip ]; then
            echo "games.zip not found – using empty placeholder"
            mkdir -p games_content
            echo "Put your .exe games here" > games_content/README.txt
            zip -r games.zip games_content
          fi

          # Put the games into the assets so the app can see them
          mkdir -p apk_unpacked/assets/games
          unzip -o games.zip -d apk_unpacked/assets/games

          # Optional: also place a copy in a default container path if the base supports it
          mkdir -p apk_unpacked/assets/containers/default
          cp -r apk_unpacked/assets/games/* apk_unpacked/assets/containers/default/ 2>/dev/null || true

      - name: Rebrand (optional but recommended)
        run: |
          # Change package name so it installs side-by-side with original Winlator
          # This is a simple string replace – for production use apktool properly
          find apk_unpacked -type f \( -name "*.xml" -o -name "*.smali" -o -name "AndroidManifest.xml" \) -print0 | \
            xargs -0 sed -i 's/com.winlator/com.yourname.xpplayer/g' || true

          # Change visible app name
          find apk_unpacked -name "strings.xml" -print0 | \
            xargs -0 sed -i 's/>Winlator</>XP Game Player</g' || true

      - name: Repack APK
        run: |
          cd apk_unpacked
          zip -r -9 ../unsigned.apk .
          cd ..

          # Align
          zipalign -v 4 unsigned.apk aligned.apk

      - name: Sign APK (debug key for testing)
        run: |
          # Generate a temporary debug keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=XP Player, OU=Dev, O=Dev, L=City, S=State, C=US" || true

          apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
            --out XP-Game-Player.apk aligned.apk

          apksigner verify XP-Game-Player.apk
          ls -lh XP-Game-Player.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XP-Game-Player-APK
          path: XP-Game-Player.apk
          retention-days: 30
